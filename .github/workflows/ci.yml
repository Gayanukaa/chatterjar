name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Acceptance checks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      # Speaks the Upstash REST API in front of the redis service, so no secrets.
      srh:
        image: hiett/serverless-redis-http:latest
        ports: ["8079:80"]
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      KV_REST_API_URL: http://localhost:8079
      KV_REST_API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  self-host:
    name: Docker self-host smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: ADMIN_KEY=ci-admin-key docker compose up -d --build
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/room > /dev/null && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Check state, device cookie and admin key
        run: |
          curl -sf http://localhost:3000/api/room | grep -q '"epoch"'
          # Plain HTTP must still get a device cookie, so it must not be Secure.
          curl -si http://localhost:3000/api/me | grep -i '^set-cookie: rid=' | grep -viq secure
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/admin/withdraw)" = 401
          curl -sf -X POST -H 'x-admin-key: ci-admin-key' -H 'content-type: application/json' \
            -d '{"pack":"demo"}' http://localhost:3000/api/admin/presets | grep -q demo-moons
      - if: always()
        run: docker compose down -v
