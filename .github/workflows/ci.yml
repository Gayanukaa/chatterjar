name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Acceptance checks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      # Speaks the Upstash REST API in front of the redis service, so no secrets.
      srh:
        image: hiett/serverless-redis-http:latest
        ports: ["8079:80"]
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-token
          SRH_CONNECTION_STRING: redis://redis:6379
    env:
      KV_REST_API_URL: http://localhost:8079
      KV_REST_API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
