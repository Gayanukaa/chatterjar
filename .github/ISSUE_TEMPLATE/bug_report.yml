name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /admin\n2. Click Reveal\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        [
          Phone page (/),
          Projector (/screen),
          Admin (/admin),
          API,
          Deploy or setup,
        ]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15, Chrome 140 on Windows
